# Builds the game and publishes it to GitHub Pages: PRODUCTION.
# It never runs on a push. Nothing ships until someone asks for it: `npm run ship` (or the
# "Run workflow" button on GitHub's Actions tab) publishes the current main.
# The hosted build is story-only (VITE_SOLO_ONLY): Pages serves static files, so there is no
# multiplayer server behind it. The testing Studio only exists in dev builds, so it never ships.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SOLO_ONLY: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
